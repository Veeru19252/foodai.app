name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foodai
          POSTGRES_PASSWORD: foodai_pass
          POSTGRES_DB: foodai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodai -d foodai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Create test database
        run: |
          PGPASSWORD=foodai_pass psql -h 127.0.0.1 -U foodai -d foodai \
            -c "CREATE DATABASE foodai_test OWNER foodai;"
      - name: Run tests
        run: pytest tests/ -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: foodai
          POSTGRES_PASSWORD: foodai_pass
          POSTGRES_DB: foodai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U foodai -d foodai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: .
        run: pip install -r requirements.txt
      - name: Start backend (seeds the foodai database)
        working-directory: .
        env:
          SIM_INTERVAL_SECONDS: "1.0"
        run: |
          nohup uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/api/health || { cat /tmp/uvicorn.log; exit 1; }
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build
      - name: Run e2e tests
        env:
          CI: "true"
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
